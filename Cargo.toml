[workspace]
resolver = "3"
members = ["crates/modukit-core", "crates/modukit-runtime", "crates/modukit-codegen", "crates/modukit-transport", "test-plugins/example-plugin", "test-plugins/bad-plugin", "test-plugins/busv2-plugin", "test-plugins/liar-plugin", "test-plugins/timerv3-plugin", "examples"]

# Single version authority for the whole workspace; the root CMakeLists reads this
# literal at configure time (hard error on mismatch - D67 grammar, iceoryx2's
# five-literal debt avoided by construction).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitee.com/chengxuewen/ModuKit"
