[workspace]
resolver = "3"
members = ["crates/modukit-core", "crates/modukit-runtime", "crates/modukit-codegen", "crates/modukit-transport", "crates/modukit-js", "test-plugins/rs/example-plugin", "test-plugins/rs/bad-plugin", "test-plugins/rs/busv2-plugin", "test-plugins/rs/liar-plugin", "test-plugins/rs/timerv3-plugin", "examples"]

# Single version authority for the whole workspace; the root CMakeLists reads this
# literal at configure time (hard error on mismatch - D67 grammar, iceoryx2's
# five-literal debt avoided by construction).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://gitee.com/chengxuewen/ModuKit"

# D104 T2.4: production zones of the five shipped crates may not unwrap or expect;
# fixtures/examples stay exempt (they do not opt in). Test zones keep the valve
# via clippy.toml allow-*-in-tests. Blanket allows are forbidden (plan §10).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
