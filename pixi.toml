# pixi.toml - the single toolchain for ModuKit (B4: mise/rust-toolchain retired).
# pixi.lock is the reproducibility pin; channels stay single (conda-forge), following the
# VisiaEngine measured route (conda-forge rust via pixi, their D5; D57 deploy-side mirror).
[workspace]
name = "modukit"
version = "0.0.0"          # placeholder until M2: real version single-source = workspace Cargo.toml (D67)
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[feature.tools.dependencies]
cmake = ">=3.25"           # embed floor (D66); system cmake 3.16 is deliberately NOT trusted
ninja = "*"
libprotobuf = ">=4"         # ships bin/protoc on conda-forge (the `protobuf` package is python bindings only); M4 ledger toolchain (D12/D13), pinned env - never the system one

[feature.tools.target.linux-64.dependencies]
gxx_linux-64 = "*"       # PolyOrch PlatformSupport needs a CXX identity before embed (observed first-red M1 2026-10-15)

[feature.tools.target.win-64.dependencies]
clang_win-64 = "*"       # windows-side compiler shim (conda convention: activation injects CC/CXX)

[feature.tools.tasks]
configure = "cmake -S . -B out/build -G Ninja"
build = { cmd = "cmake --build out/build", depends-on = ["configure"] }
ci = "bash scripts/check.sh"                                   # the local gate; CONSTRAINTS is generated from --list
docs-gen = "bash scripts/gen-llms-txt.sh"                        # regenerate llms.txt (committed)
gate-abi = "bash scripts/gate-abi.sh"                            # exported symbol set vs contracts/modukit_embed.h
regen-fdset = "bash scripts/regen-fdset.sh"                     # regenerate contracts/*.fdset in place (D12 ledger)
regen-golden = "bash scripts/regen-golden.sh"                    # rewrite crates/modukit-codegen/testdata/golden (review the diff!)
codegen = "bash scripts/regen-golden.sh"                         # alias for the golden regeneration workflow
# S2-M4 vendor lane (D76): the non-default `vendor-shm` feature lane — equivalence
# + leak tests. Deliberately NOT part of check.sh (D50 fast-gate discipline).
vendor-test = "cargo test -p modukit-transport --features vendor-shm"

# T3.4 deny leg (wave-2 benchmark plan): license+bans audit against deny.toml;
# check.sh runs it only when the tool resolves, else loud skip (offline box).
deny = "cargo deny check licenses bans"

# MCP single source (B1): node runs the pinned npm launchers; python runs the CLI/gate.
# Node lives here because B1 cannot work without it; B4 keeps it as the single node
# (mise is retired).
[feature.mcp.dependencies]
nodejs = ">=22,<23"
python = ">=3.11,<4"

[feature.mcp.tasks]
mcp = "python scripts/mcp-cli.py"
mcp-codegraph = "node scripts/mcp-serve.mjs --from scripts/mcp-servers.json --name local-codegraph"
mcp-playwright = "node scripts/mcp-serve.mjs --from scripts/mcp-servers.json --name local-playwright"
gate-mcp = "python scripts/gate-mcp.py"

[feature.rust.dependencies]
rust = ">=1.99,<2"

# MSRV is a promise, not a lock echo: the Cargo.toml rust-version and this pin
# must agree (scripts/check-msrv.sh). 1.88 is the measured floor (B4 probe).
[feature.msrv.dependencies]
rust = "=1.88.0"

[feature.msrv.tasks]
msrv = "cargo check --workspace"

[feature.cov.dependencies]
# M8 coverage run (D50 soft gate): conda-forge ships the tool itself - no workspace
# Cargo dependency is touched, the vendor-lock floor stays green.
cargo-llvm-cov = "*"
llvm-tools = "*"            # ships llvm-cov / llvm-profdata the wrapper drives

[feature.cov.activation]
# PIT-10 disposition (2026-10-18): profile raw files get ONE redirect
# target inside the cov target dir - spawned children inherit the env,
# so no default_*.profraw ever lands in the source tree, and the
# instrumented-run writer class is fully accounted for.
env = { LLVM_PROFILE_FILE = "target/llvm-cov-target/cov-%p-%m.profraw" }

# Serena MCP: isolated Python 3.13 + serena-agent; own environment (no base group).
# clang-tools is deliberately absent until its availability is proven; the C++ backend
# gap is recorded in docs/ve-parity-plan.md.
[feature.serena.dependencies]
python = "3.13.*"
rust = ">=1.99,<2"
rust-src = "*"
rust-analyzer = "*"

[feature.serena.pypi-dependencies]
serena-agent = "==2.1.0"

[feature.serena.tasks]
mcp-serena = "serena start-mcp-server --transport stdio --context claude-code --language-backend LSP --project \"$PIXI_PROJECT_ROOT\""

[feature.agents.tasks]
agents = "python scripts/agents-cli.py"
agent-sync = "python scripts/agents-cli.py sync"
gate-agents = "python scripts/agents-cli.py check"

[environments]
default = { features = ["tools", "rust", "mcp", "agents"], solve-group = "base" }
# cov rides its own solve group: the default build env resolution stays untouched.
cov = { features = ["rust", "cov"] }
serena = { features = ["serena"] }
msrv = { features = ["msrv"] }
