[package]
name = "modukit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ModuKit kernel: six-state machine, manifest v0, C+ registry, dl executor (Stage-1 scaffold - M3 fills it)"

[lib]
name = "modukit_core"
path = "src/lib.rs"
# rlib stays the workspace's compile unit; staticlib is the C ABI exit the
# Stage-4 M1 embed demo links against (the HostEmbedV1 symbols in
# `embed.rs` reach a C++ executable through `libmodukit_core.a`; cdylib is the
# same C ABI exit for the wave-2 Python band - ctypes dlopens
# `libmodukit_core.so` (D100 R4-A, the one-line link floor).
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
