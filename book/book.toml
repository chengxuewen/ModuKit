[book]
title = "ModuKit"
authors = ["ModuKit contributors"]
src = "../build/book-src"
language = "en"

# build-dir is deliberately NOT set here: book-build passes -d per language
# (www/book/en, www/book/zh-CN) so each build clears only its own subtree.
[output.html]
git-repository-url = "https://gitee.com/chengxuewen/ModuKit"
edit-url-template = "https://gitee.com/chengxuewen/ModuKit/edit/master/{path}"
additional-js = ["web/mermaid-init.js", "web/footer.js"]
